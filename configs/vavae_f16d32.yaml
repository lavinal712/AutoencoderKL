model:
  base_learning_rate: 1.0e-4
  target: sgm.models.autoencoder.AutoencoderKL
  params:
    input_key: jpg
    monitor: "val/loss/rec"
    disc_start_iter: 50001
    embed_dim: 32

    ddconfig:
      attn_type: vanilla-xformers
      double_z: true
      z_channels: 32
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0

    lossconfig:
      target: sgm.modules.autoencoding.losses.VFLossWithDiscriminator
      params:
        perceptual_weight: 0.25
        disc_start: 50001
        disc_weight: 0.5
        learn_logvar: false

        regularization_weights:
          kl_loss: 1.0e-6

        embed_dim: 32
        foundation_model: hf-hub:timm/vit_large_patch14_reg4_dinov2.lvd142m
        reverse_proj: true
        vf_weight: 0.1
        adaptive_vf: true
        cos_weight: 1.0
        distmat_weight: 1.0
        cos_margin: 0.5
        distmat_margin: 0.25

data:
  target: sgm.data.imagenet.ImageNetLoader
  params:
    batch_size: 24
    num_workers: 4
    prefetch_factor: 2
    shuffle: true
    drop_last: true
    pin_memory: true

    train:
      root_dir: /path/to/ImageNet
      transform_config:
        image_transforms:
          - target: torchvision.transforms.v2.Resize
            params:
              size: 256
              antialias: true
          - target: torchvision.transforms.v2.RandomCrop
            params:
              size: 256
          - target: torchvision.transforms.v2.RandomHorizontalFlip
            params:
              p: 0.5

    validation:
      root_dir: /path/to/ImageNet
      transform_config:
        size: 256

lightning:
  strategy:
    target: pytorch_lightning.strategies.DDPStrategy
    params:
      find_unused_parameters: True

  modelcheckpoint:
    params:
      every_n_epochs: 1

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 50000

    image_logger:
      target: main.ImageLogger
      params:
        enable_autocast: False
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    precision: 32-true
    devices: 0, 1, 2, 3
    limit_val_batches: 50
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    max_epochs: 100
